databases:
  - name: caliza360-db
    plan: free
    databaseName: caliza360

services:
  - type: web
    name: caliza360-api
    runtime: docker
    plan: free
    repo: https://github.com/wadvance/caliza360
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: AI_SERVICE_ENABLED
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: DATABASE_URL
        fromDatabase:
          name: caliza360-db
          property: connectionString
